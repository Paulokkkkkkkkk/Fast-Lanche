<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description"
        content="Fast Lanche - Feedbacks. Veja avaliacoes de clientes e compartilhe sua opiniao." />
    <meta name="theme-color" content="#161616" />
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="Fast Lanche - Feedbacks" />
    <meta property="og:description" content="Veja avaliacoes de clientes e compartilhe sua opiniao." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="assets/logo/fast-lanche-logo.svg" />
    <title>Fast Lanche - Feedbacks</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="apple-touch-icon" href="assets/icons/favicon.svg">
    <link rel="preload" href="css/styles.css" as="style">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main id="top">
        <section id="feedback-page" class="page-section feedback-page-section" aria-labelledby="feedback-page-title">
            <div class="container">
                <div class="section-heading">
                    <div>
                        <p class="section-kicker">Opiniões</p>
                        <h1 id="feedback-page-title">Feedbacks</h1>
                    </div>
                </div>

                <div class="feedback-layout">
                    <div>
                        <div class="rating-summary">
                            <strong id="average-rating">0,0</strong>
                            <span>media das avaliações</span>
                        </div>
                        <div id="feedback-list" class="feedback-list"></div>
                    </div>
                    <form id="feedback-form" class="panel-form">
                        <label class="field" for="feedback-name">
                            <span>Nome</span>
                            <input id="feedback-name" name="name" type="text" required>
                        </label>
                        <label class="field" for="feedback-rating">
                            <span>Nota: <strong id="rating-value">5</strong>/5</span>
                            <input id="feedback-rating" name="rating" type="range" min="1" max="5" value="5">
                        </label>
                        <label class="field" for="feedback-comment">
                            <span>Comentario</span>
                            <textarea id="feedback-comment" name="comment" rows="4" minlength="10" required></textarea>
                        </label>
                        <button class="button button-primary" type="submit">Enviar feedback</button>
                        <p id="feedback-message" class="form-feedback" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal overlay para confirmacoes -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close" type="button" aria-label="Fechar modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="js/page-init.js"></script>
</body>

</html>
