<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description"
        content="Fast Lanche - Cardapio completo. Explore nossos lanches, pizzas, combos, bebidas, sobremesas e porcoes." />
    <meta name="theme-color" content="#161616" />
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="Fast Lanche - Cardapio" />
    <meta property="og:description" content="Explore nosso cardapio completo e monte seu pedido." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="assets/logo/fast-lanche-logo.svg" />
    <title>Fast Lanche - Cardapio</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="apple-touch-icon" href="assets/icons/favicon.svg">
    <link rel="preload" href="css/styles.css" as="style">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main id="top">
        <section id="menu" class="page-section menu-section" aria-labelledby="menu-title">
            <div class="container">
                <div class="section-heading">
                    <div>
                        <p class="section-kicker">Cardápio online</p>
                        <h1 id="menu-title">Escolha seu lanche</h1>
                    </div>
                    <div class="menu-tools" aria-label="Filtros do cardapio">
                        <label class="field field-inline" for="search-input">
                            <span>Buscar</span>
                            <input id="search-input" type="search" placeholder="Nome ou descricao">
                        </label>
                        <label class="field field-inline" for="category-filter">
                            <span>Categoria</span>
                            <select id="category-filter">
                                <option value="all">Todas</option>
                                <option value="Hambúrgueres">Hambúrgueres</option>
                                <option value="Pizzas">Pizzas</option>
                                <option value="Combos">Combos</option>
                                <option value="Bebidas">Bebidas</option>
                                <option value="Sobremesas">Sobremesas</option>
                                <option value="Porções">Porções</option>
                            </select>
                        </label>
                    </div>
                </div>
                <div id="menu-items" class="cards-grid" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <!-- Modal overlay para confirmacoes -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close" type="button" aria-label="Fechar modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="js/page-init.js"></script>
</body>

</html>
