<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Fast Lanche - Checkout. Finalize seu pedido com entrega e pagamento simulado." />
    <meta name="theme-color" content="#161616" />
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="Fast Lanche - Checkout" />
    <meta property="og:description" content="Finalize seu pedido com entrega e pagamento." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="assets/logo/fast-lanche-logo.svg" />
    <title>Fast Lanche - Checkout</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="apple-touch-icon" href="assets/icons/favicon.svg">
    <link rel="preload" href="css/styles.css" as="style">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main id="top">
        <section id="checkout-page" class="page-section checkout-page-section" aria-labelledby="checkout-page-title">
            <div class="container">
                <div class="section-heading">
                    <div>
                        <p class="section-kicker">Pagamento direto</p>
                        <h1 id="checkout-page-title">Checkout</h1>
                    </div>
                    <span class="secure-pill">Ambiente simulado</span>
                </div>

                <div class="checkout-page-layout">
                    <div class="checkout-page-form">
                        <form id="checkout-form" class="form-grid">
                            <label class="field" for="checkout-name">
                                <span>Nome completo</span>
                                <input id="checkout-name" name="name" type="text" autocomplete="name" minlength="3"
                                    required>
                            </label>
                            <label class="field" for="checkout-phone">
                                <span>Telefone</span>
                                <input id="checkout-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"
                                    minlength="10" maxlength="15" placeholder="(00) 00000-0000" required>
                            </label>
                            <label class="field field-full" for="checkout-address">
                                <span>Endereco de entrega</span>
                                <input id="checkout-address" name="address" type="text" autocomplete="street-address"
                                    minlength="8" required>
                            </label>
                            <label class="field" for="checkout-payment">
                                <span>Pagamento</span>
                                <select id="checkout-payment" name="payment" required>
                                    <option value="">Selecione</option>
                                    <option value="pix">Pix</option>
                                    <option value="card">Cartao</option>
                                    <option value="cash">Dinheiro</option>
                                </select>
                            </label>
                            <label class="field" for="checkout-document">
                                <span>CPF/CNPJ opcional</span>
                                <input id="checkout-document" name="document" type="text" inputmode="numeric"
                                    minlength="11" maxlength="18">
                            </label>
                            <label class="field field-full field-checkbox" for="checkout-use-profile">
                                <input id="checkout-use-profile" name="use-profile" type="checkbox" checked>
                                <span>Usar dados do perfil</span>
                            </label>
                            <div class="field-full form-actions">
                                <button class="button button-primary" type="submit">Finalizar pedido</button>
                                <p id="checkout-feedback" class="form-feedback" aria-live="polite"></p>
                            </div>
                        </form>
                    </div>

                    <aside class="checkout-page-summary">
                        <div class="section-heading compact-heading">
                            <div>
                                <p class="section-kicker">Resumo</p>
                                <h2>Seu pedido</h2>
                            </div>
                        </div>
                        <ul id="checkout-items" class="checkout-items-list"></ul>
                        <dl class="cart-summary">
                            <div>
                                <dt>Subtotal</dt>
                                <dd id="checkout-subtotal">R$ 0,00</dd>
                            </div>
                            <div>
                                <dt>Entrega</dt>
                                <dd id="checkout-fee">R$ 0,00</dd>
                            </div>
                            <div class="summary-total">
                                <dt>Total</dt>
                                <dd id="checkout-total">R$ 0,00</dd>
                            </div>
                        </dl>
                    </aside>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal overlay para confirmacoes -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close" type="button" aria-label="Fechar modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="js/page-init.js"></script>
</body>

</html>
