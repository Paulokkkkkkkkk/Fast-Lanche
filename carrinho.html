<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description"
        content="Fast Lanche - Carrinho de compras. Revise seu pedido, quantidades e valores antes de finalizar." />
    <meta name="theme-color" content="#161616" />
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="Fast Lanche - Carrinho" />
    <meta property="og:description" content="Revise seu pedido antes de finalizar." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="assets/logo/fast-lanche-logo.svg" />
    <title>Fast Lanche - Carrinho</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="apple-touch-icon" href="assets/icons/favicon.svg">
    <link rel="preload" href="css/styles.css" as="style">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main id="top">
        <section id="cart-page" class="page-section cart-page-section" aria-labelledby="cart-page-title">
            <div class="container">
                <div class="section-heading">
                    <div>
                        <p class="section-kicker">Seu pedido</p>
                        <h1 id="cart-page-title">Carrinho</h1>
                    </div>
                    <span class="cart-count" id="cart-count">0 itens</span>
                </div>

                <div class="cart-page-layout">
                    <div class="cart-page-items">
                        <ul id="cart-items" class="cart-items">
                            <li class="empty-state">Seu carrinho esta vazio.</li>
                        </ul>
                    </div>

                    <aside class="cart-page-summary">
                        <dl class="cart-summary">
                            <div>
                                <dt>Subtotal</dt>
                                <dd id="cart-subtotal">R$ 0,00</dd>
                            </div>
                            <div>
                                <dt>Entrega</dt>
                                <dd id="cart-fee">R$ 0,00</dd>
                            </div>
                            <div class="summary-total">
                                <dt>Total</dt>
                                <dd id="cart-total">R$ 0,00</dd>
                            </div>
                        </dl>

                        <div class="cart-page-actions">
                            <a class="button button-secondary" href="cardapio.html">Continuar comprando</a>
                            <a class="button button-primary" href="checkout.html">Finalizar pedido</a>
                            <button class="button button-secondary cart-clear-btn" id="clear-cart-btn"
                                type="button">Limpar carrinho</button>
                        </div>
                    </aside>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal overlay para confirmacoes -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close" type="button" aria-label="Fechar modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="js/page-init.js"></script>
</body>

</html>
