<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <style>
      @keyframes shake { 0%,100% { transform: translateX(0) rotate(0) } 15% { transform: translateX(2px) rotate(1deg) } 30% { transform: translateX(-1px) rotate(-.5deg) } 45% { transform: translateX(2px) rotate(1deg) } 60% { transform: translateX(0) rotate(0) } }
      @keyframes steamUp { 0%,100% { opacity: .2; transform: translateY(0) scale(1) } 50% { opacity: .5; transform: translateY(-8px) scale(1.1) } }
      .shake { animation: shake 4s ease-in-out infinite; transform-origin: center }
      .steam2 { animation: steamUp 2s ease-in-out infinite }
    </style>
  </defs>
  <!-- Cesta/papel -->
  <path d="M50 140 L55 60 Q120 55 185 60 L190 140 Z" fill="#FFCC80"/>
  <path d="M50 140 Q120 150 190 140" fill="#FFA726"/>
  <path d="M50 140 Q120 150 190 140" fill="#FF8F00" opacity=".15"/>
  <!-- Batatas fritas empilhadas (shake) -->
  <g class="shake">
    <rect x="80" y="70" width="14" height="50" rx="4" fill="#FFB300" transform="rotate(-8 87 95)"/>
    <rect x="90" y="65" width="14" height="55" rx="4" fill="#FFCA28" transform="rotate(-3 97 92)"/>
    <rect x="100" y="60" width="14" height="60" rx="4" fill="#FFB300" transform="rotate(2 107 90)"/>
    <rect x="110" y="62" width="14" height="58" rx="4" fill="#FFCA28" transform="rotate(7 117 91)"/>
    <rect x="120" y="68" width="14" height="52" rx="4" fill="#FFB300" transform="rotate(12 127 94)"/>
    <!-- Camada frontal -->
    <rect x="85" y="80" width="12" height="45" rx="3" fill="#FFC107" transform="rotate(-12 91 102)"/>
    <rect x="100" y="75" width="12" height="50" rx="3" fill="#FFD54F" transform="rotate(-5 106 100)"/>
    <rect x="115" y="78" width="12" height="45" rx="3" fill="#FFC107" transform="rotate(5 121 100)"/>
    <rect x="93" y="88" width="12" height="40" rx="3" fill="#FFB300" transform="rotate(-18 99 108)"/>
  </g>
  <!-- Tempero salpicado -->
  <circle cx="105" cy="72" r="1" fill="#FFFFFF" opacity=".6"/>
  <circle cx="118" cy="70" r="1" fill="#FFFFFF" opacity=".5"/>
  <circle cx="95" cy="76" r="1" fill="#FFFFFF" opacity=".6"/>
  <circle cx="110" cy="80" r="1" fill="#FFFFFF" opacity=".5"/>
  <!-- Vapor -->
  <path d="M100 55 Q95 45 100 35" stroke="#DDD" stroke-width="2" fill="none" class="steam2" opacity=".3"/>
  <path d="M120 52 Q115 42 120 32" stroke="#DDD" stroke-width="2" fill="none" class="steam2" opacity=".3" style="animation-delay:.7s"/>
  <!-- Logo Fast-Lanche mini -->
  <rect x="68" y="126" width="22" height="12" rx="3" fill="#E63946"/>
  <text x="79" y="135" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#FFFFFF">FL</text>
</svg>