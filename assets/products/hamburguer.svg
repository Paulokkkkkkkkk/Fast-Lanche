<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <style>
      @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @keyframes steam { 0%,100% { opacity: .3; transform: translateY(0) scale(1) } 50% { opacity: .6; transform: translateY(-6px) scale(1.1) } }
      .bounce { animation: bounce 2s ease-in-out infinite }
      .steam { animation: steam 2.5s ease-in-out infinite; transform-origin: center }
    </style>
  </defs>
  <!-- Pao superior -->
  <ellipse cx="120" cy="65" rx="80" ry="35" fill="#D4A24C"/>
  <ellipse cx="120" cy="62" rx="72" ry="28" fill="#E8B85A"/>
  <!-- Gergelim -->
  <circle cx="90" cy="52" r="3" fill="#F0D48A"/>
  <circle cx="110" cy="48" r="3" fill="#F0D48A"/>
  <circle cx="130" cy="50" r="3" fill="#F0D48A"/>
  <circle cx="150" cy="55" r="3" fill="#F0D48A"/>
  <!-- Alface -->
  <ellipse cx="120" cy="80" rx="75" ry="10" fill="#4CAF50"/>
  <path d="M50 80 Q60 70 70 80 Q80 90 90 80 Q100 70 110 80 Q120 90 130 80 Q140 70 150 80 Q160 90 170 80 Q180 70 190 80" fill="#66BB6A"/>
  <!-- Queijo -->
  <ellipse cx="120" cy="90" rx="70" ry="8" fill="#FFD54F"/>
  <!-- Hamburguer -->
  <ellipse cx="120" cy="102" rx="68" ry="14" fill="#6D4C41"/>
  <ellipse cx="120" cy="100" rx="62" ry="10" fill="#795548" class="bounce"/>
  <!-- Tomate -->
  <ellipse cx="120" cy="112" rx="65" ry="6" fill="#E53935"/>
  <!-- Pao inferior -->
  <ellipse cx="120" cy="122" rx="72" ry="12" fill="#D4A24C"/>
  <!-- Vapor animado -->
  <path d="M95 48 Q90 38 95 30" stroke="#DDD" stroke-width="2" fill="none" class="steam" opacity=".4"/>
  <path d="M120 45 Q115 35 120 27" stroke="#DDD" stroke-width="2" fill="none" class="steam" opacity=".3" style="animation-delay:.5s"/>
  <path d="M145 50 Q140 40 145 32" stroke="#DDD" stroke-width="2" fill="none" class="steam" opacity=".4" style="animation-delay:1s"/>
  <!-- Prato -->
  <ellipse cx="120" cy="132" rx="85" ry="8" fill="#E0E0E0"/>
  <ellipse cx="120" cy="130" rx="82" ry="6" fill="#F5F5F5"/>
</svg>