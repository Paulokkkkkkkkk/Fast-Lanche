<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <style>
      @keyframes fillBubbles {
        0% { opacity: 0; transform: translateY(0) scale(0.5); }
        50% { opacity: 0.8; }
        100% { opacity: 0; transform: translateY(-30px) scale(1.2); }
      }
      @keyframes drip {
        0%,100% { opacity: 0; transform: translateY(0); }
        50% { opacity: 0.4; transform: translateY(8px); }
      }
      .bubble { animation: fillBubbles 2.5s ease-out infinite; }
      .drip { animation: drip 2s ease-in-out infinite; }
    </style>
  </defs>
  <path d="M90 30 L85 140 Q85 150 95 150 L145 150 Q155 150 155 140 L150 30 Z" fill="#E0F7FA" opacity="0.6"/>
  <path d="M90 30 L85 140 Q85 150 95 150 L145 150 Q155 150 155 140 L150 30 Z" fill="none" stroke="#B2EBF2" stroke-width="2"/>
  <path d="M92 50 L87 138 Q87 146 95 146 L145 146 Q153 146 153 138 L148 50 Z" fill="#FF9800" opacity="0.7"/>
  <path d="M92 50 L87 138 Q87 146 95 146 L145 146 Q153 146 153 138 L148 50 Z" fill="#FFB74D" opacity="0.5"/>
  <rect x="105" y="60" width="18" height="16" rx="2" fill="#FFFFFF" opacity="0.5" transform="rotate(15 114 68)"/>
  <rect x="125" y="65" width="14" height="14" rx="2" fill="#FFFFFF" opacity="0.4" transform="rotate(-10 132 72)"/>
  <circle cx="115" cy="80" r="3" fill="#FFFFFF" class="bubble" style="animation-delay:0s"/>
  <circle cx="132" cy="90" r="2.5" fill="#FFFFFF" class="bubble" style="animation-delay:0.6s"/>
  <circle cx="108" cy="100" r="2" fill="#FFFFFF" class="bubble" style="animation-delay:1.2s"/>
  <circle cx="125" cy="110" r="2" fill="#FFFFFF" class="bubble" style="animation-delay:1.8s"/>
  <circle cx="93" cy="65" r="2" fill="#B2EBF2" opacity="0.4" class="drip"/>
  <circle cx="90" cy="85" r="2" fill="#B2EBF2" opacity="0.4" class="drip" style="animation-delay:0.5s"/>
  <circle cx="92" cy="105" r="2" fill="#B2EBF2" opacity="0.4" class="drip" style="animation-delay:1s"/>
  <rect x="148" y="20" width="4" height="60" rx="2" fill="#E53935" transform="rotate(-15 150 50)"/>
  <rect x="145" y="20" width="10" height="4" rx="2" fill="#E53935" transform="rotate(-15 150 22)"/>
  <circle cx="157" cy="28" r="2" fill="#FF9800" opacity="0.5" class="drip" style="animation-delay:0.3s"/>
</svg>