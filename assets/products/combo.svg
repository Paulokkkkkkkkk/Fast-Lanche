<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
      @keyframes spin { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
      .float { animation: float 2.5s ease-in-out infinite }
      .spin-slow { animation: spin 8s linear infinite; transform-origin: 190px 120px }
    </style>
  </defs>
  <!-- Hamburguer (menor) -->
  <ellipse cx="80" cy="85" rx="40" ry="18" fill="#D4A24C"/>
  <ellipse cx="80" cy="82" rx="36" ry="14" fill="#E8B85A"/>
  <ellipse cx="80" cy="95" rx="35" ry="6" fill="#4CAF50"/>
  <ellipse cx="80" cy="100" rx="34" ry="7" fill="#6D4C41"/>
  <ellipse cx="80" cy="107" rx="36" ry="6" fill="#D4A24C" class="float"/>
  <!-- Batata frita -->
  <rect x="130" y="70" width="10" height="45" rx="3" fill="#FFB300" transform="rotate(-15 135 92)"/>
  <rect x="142" y="65" width="10" height="50" rx="3" fill="#FFC107" transform="rotate(-5 147 90)"/>
  <rect x="155" y="68" width="10" height="45" rx="3" fill="#FFB300" transform="rotate(10 160 90)"/>
  <rect x="168" y="72" width="10" height="40" rx="3" fill="#FFCA28" transform="rotate(20 173 92)"/>
  <!-- Batata adicional -->
  <rect x="137" y="62" width="9" height="35" rx="3" fill="#FF8F00" transform="rotate(-10 141 80)"/>
  <rect x="160" y="60" width="9" height="35" rx="3" fill="#FF8F00" transform="rotate(15 164 78)"/>
  <!-- Refrigerante -->
  <rect x="130" y="110" width="55" height="35" rx="4" fill="#E53935"/>
  <rect x="130" y="110" width="55" height="8" rx="4" fill="#C62828"/>
  <text x="157" y="133" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">COLA</text>
  <!-- Canudo -->
  <rect x="165" y="85" width="2" height="28" fill="#FFFFFF" rx="1"/>
  <circle cx="166" cy="85" r="4" fill="#FFC107"/>
  <!-- Prato -->
  <ellipse cx="80" cy="115" rx="45" ry="5" fill="#E0E0E0"/>
</svg>